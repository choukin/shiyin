name: CI

# main 与 PR 的轻量门禁：纯 JVM 单测 + debug 包，不产出 Release。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: shiyin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test & build debug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK（runner 预装）
        run: |
          set -euo pipefail
          # 不用 android-actions/setup-android@v3：其 packages 默认值含已被 Google 下架的
          # legacy "tools" 包，新版 ubuntu runner 上 sdkmanager 会报
          # "Failed to find package 'tools'" 并退出 1（2026 年多起同类故障）。
          # ubuntu-latest 自带 Android SDK 且 licenses 已接受，这里只补环境变量与 PATH。
          : "${ANDROID_HOME:=/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::找不到 sdkmanager，请检查 runner 的 Android SDK 路径"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "sdkmanager: $SDKMANAGER"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: SDK 许可与组件
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          # 缺失时由 AGP 按 compileSdk 自动补齐；这里安装失败不阻塞
          sdkmanager --install "platforms;android-37" "build-tools;36.0.0" "platform-tools" > /dev/null || true

      - name: 单测 + Debug 包
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shiyin-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

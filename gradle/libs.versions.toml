# 拾音 · 单机音乐播放器 — 唯一版本事实源
# 核实日期：2026-11-13；来源：Google Maven / Maven Central maven-metadata.xml、kotlinlang.org
# 规则：androidx.compose.* 由 BOM 统一管理，[libraries] 中不写 version。
# 规则：Compose Compiler 插件版本与 Kotlin 共用同一 version.ref，不要单独锁。
# 规则：依赖统一在此登记；media3 各模块必须共用 version.ref = "media3"，避免 ABI 错配。
# 二期已启用 media3-transformer（05 裁剪 / 06 提取音频）与 OkHttp（04 链接下载，需 INTERNET）。

[versions]
agp = "9.5.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
navigationCompose = "2.10.2"
lifecycle = "2.11.0"
coreKtx = "1.19.1"
media3 = "1.11.1"
coil3 = "3.6.3"
datastore = "1.3.0"
coroutines = "1.11.0"
junit = "4.13.2"
# OkHttp 5.5.1：Maven Central 最新稳定版（核实 2026-11-19，5.0.0-alpha.* 为预发布不采用）
okhttp = "5.5.1"
# LAME MP3 编码器：MIT 协议，Maven Central 真实构件（核实 2026-11-20，AAR 含 arm64-v8a libLame.so）。
# Android 平台无 MP3 编码器、Media3 Transformer 也无法输出 MP3，故引入 LAME 走「PCM→MP3」链路。
# 注意：仅 arm64-v8a，x86 模拟器上 MP3 导出不可用（M4A/WAV 不受影响）。
lame-mp3 = "1.0.4"

# 平台级别（写在 app/build.gradle.kts，此处仅作记录）
# compileSdk = 37 / targetSdk = 36 / minSdk = 26 / Java = 17
# Gradle distribution = 9.6.0（需由用户侧 Sync 复核与 AGP 9.5.1 的兼容性）

[libraries]
# ---- Compose（BOM 管理，无 version）----
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }

# ---- 宿主 / 导航 / 状态（不在 BOM 内，单独锁版本）----
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# ---- 媒体播放 ----
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
media3-datasource = { group = "androidx.media3", name = "media3-datasource", version.ref = "media3" }
media3-extractor = { group = "androidx.media3", name = "media3-extractor", version.ref = "media3" }
# 二期：音频裁剪 / 视频提取音频，与播放链路共用 media3 = 1.11.1
media3-transformer = { group = "androidx.media3", name = "media3-transformer", version.ref = "media3" }

# ---- MP3 编码（05/06 导出格式可选项；仅 arm64-v8a）----
lame-mp3 = { group = "io.github.hequanli", name = "recorder-mp3", version.ref = "lame-mp3" }

# ---- 封面 / 轻量持久化 / 异步 ----
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil3" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# ---- 网络（仅 04 链接下载使用；Coil 封面仍只走 content:// 本地 URI）----
# OkHttp 5.x 为 KMP 根 artifact，Gradle 会自动解析 jvm/android variant，无需显式写 okhttp-jvm。
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

# ---- 测试 ----
junit = { group = "junit", name = "junit", version.ref = "junit" }

# ---- 二期状态 ----
# 已落地：androidx.media3:media3-transformer 1.11.1 → 05 音乐裁剪 / 06 视频提取音频
# 已落地：com.squareup.okhttp3:okhttp 5.5.1 + INTERNET / ACCESS_NETWORK_STATE → 04 链接下载
#         仅下载用户显式输入的音/视频直链，不做第三方平台链接解析；本地导入作为次要入口保留
# 预留：FOREGROUND_SERVICE_MEDIA_PROCESSING + mediaProcessing FGS（P2，需处理 6h/天配额）
# 预留：androidx.compose.ui:ui-test-junit4 / ui-test-manifest → Compose 组件测试
# 禁用：com.arthenica:ffmpeg-kit-*（已退役、Maven 二进制下架）
# 禁用：com.google.accompanist:accompanist-permissions（改用 activity-compose 的 ActivityResultContracts）
# 不引入：Hilt / Koin / Room / KSP / Accompanist / material-icons-extended / ui-text-google-fonts
#          coil-network-okhttp / coil-svg / media3-ui / media3-ui-compose / 任何广告 SDK
# 二期追加：io.github.hequanli:recorder-mp3 1.0.4（LAME, MIT）→ MP3 导出，仅 arm64-v8a

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
